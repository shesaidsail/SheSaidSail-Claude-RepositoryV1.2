name: Lighthouse CI

# Disabled until staging URL is available.
# To re-enable: remove the 'if: false' line from the lighthouse job,
# add a .lighthouserc.json with the staging URL, and update the branch triggers.
on:
  push:
    branches:
      - staging
  pull_request:
    branches:
      - main

jobs:
  lighthouse:
    if: false
    name: Run Lighthouse Audits
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli@0.14.x

      - name: Run Lighthouse CI
        run: lhci autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

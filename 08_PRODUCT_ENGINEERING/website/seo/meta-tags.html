<!--
  SHE SAID SAIL — SEO AND SOCIAL META TAGS
  Version: 2.0

  Where to add:
  Option A (recommended): Yoast SEO or RankMath plugin
    - Meta description: paste in the SEO plugin's description field
    - Open Graph: most SEO plugins handle this automatically once
      you set the description and social image

  Option B: WordPress > Appearance > Theme Editor > header.php
    Paste the meta tags block inside <head> before </head>

  Option C: A header injection plugin such as "Insert Headers and Footers"

  Notes:
  - Replace YOUR_CANONICAL_URL with the live URL if it changes
  - Replace /wp-content/uploads/... og:image path with your best
    hero photography file (1200x630 recommended)
  - The og:image should feel like a magazine cover, not a booking form
-->

<!-- Primary SEO -->
<meta name="description" content="Private yacht experiences in Miami designed for women-led celebrations. Bachelorettes, birthdays, and the days worth doing properly. Starting from $10,000.">
<meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">
<link rel="canonical" href="https://shesaidsail.com/">

<!-- Open Graph: Facebook, LinkedIn, WhatsApp, iMessage previews -->
<meta property="og:type"        content="website">
<meta property="og:url"         content="https://shesaidsail.com/">
<meta property="og:title"       content="She Said Sail — Private Yacht Experiences in Miami">
<meta property="og:description" content="Curated yacht experiences for birthdays, bachelorettes, and girls trips in Miami. Everything handled before you arrive.">
<meta property="og:image"       content="https://shesaidsail.com/wp-content/uploads/2026/04/SheSaidSail_April2026PhotographerSusanBerry-6-scaled.jpg">
<meta property="og:image:width"  content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt"    content="Women celebrating on a luxury yacht in Miami — She Said Sail">
<meta property="og:site_name"   content="She Said Sail">
<meta property="og:locale"      content="en_US">

<!-- Twitter / X Card -->
<meta name="twitter:card"        content="summary_large_image">
<meta name="twitter:site"        content="@shesaidsail">
<meta name="twitter:title"       content="She Said Sail — Private Yacht Experiences in Miami">
<meta name="twitter:description" content="Curated yacht experiences for birthdays, bachelorettes, and girls trips. Everything handled before you arrive.">

<!-- Placement: between photo slideshow section and bottom navy CTA banner -->

<section class="sss-email-capture" aria-label="Stay in touch">
  <div class="sss-email-capture-inner">

    <p class="sss-section-eyebrow">For the curious</p>

    <h2 class="sss-email-heading sss-reveal">See what a fully curated day on the water actually looks like.</h2>

    <p class="sss-email-subtext sss-reveal sss-reveal-delay-1">We share occasion planning ideas, a look inside our experiences, and early access to new dates. No noise. Just the good stuff.</p>

    <form class="sss-email-form sss-reveal sss-reveal-delay-2" aria-label="Email signup" novalidate>
      <input
        type="email"
        name="email"
        placeholder="Your email address"
        aria-label="Email address"
        autocomplete="email"
        required
      />
      <button type="submit" aria-label="Join the inside list">Join</button>
    </form>

    <p class="sss-email-privacy sss-reveal sss-reveal-delay-3">No spam. Unsubscribe anytime. We treat your inbox the way we treat our guests.</p>

  </div>
</section>

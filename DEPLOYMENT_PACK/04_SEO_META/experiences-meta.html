<!-- =============================================================
     JSON-LD BLOCK 1: CollectionPage
     =============================================================
     WHAT THIS DOES:
       Marks the /experiences/ page as a CollectionPage, which tells search engines
       and AI systems this is an index or gallery page grouping multiple child items.
       The isPartOf reference connects this page to the WebSite entity in global-schema.html.
       The about reference connects the page content to the Organization entity,
       strengthening entity associations for knowledge graph inclusion.

     AI SYSTEMS HELPED:
       Google rich results for collection pages, AI answer engines understanding
       site structure, Bing content classification.

     FIELDS TO UPDATE BEFORE GO-LIVE:
       - Replace image URL with final uploaded asset.
-->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "CollectionPage",
  "name": "The Experiences | She Said Sail",
  "description": "All four private yacht charter experiences offered by She Said Sail in Miami and Fort Lauderdale. Curated for women-led celebrations starting from $10,000.",
  "url": "https://shesaidsail.com/experiences/",
  "image": "https://shesaidsail.com/wp-content/uploads/experiences-overview-og-hero.jpg",
  "isPartOf": {
    "@id": "https://shesaidsail.com/#website"
  },
  "about": {
    "@id": "https://shesaidsail.com/#organization"
  },
  "breadcrumb": {
    "@type": "BreadcrumbList",
    "itemListElement": [
      {
        "@type": "ListItem",
        "position": 1,
        "name": "Home",
        "item": "https://shesaidsail.com"
      },
      {
        "@type": "ListItem",
        "position": 2,
        "name": "Experiences",
        "item": "https://shesaidsail.com/experiences/"
      }
    ]
  }
}
</script>

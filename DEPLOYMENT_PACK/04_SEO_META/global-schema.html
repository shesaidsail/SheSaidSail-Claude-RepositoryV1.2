<!-- =============================================================
     SCHEMA BLOCK 1: Organization + LocalBusiness
     =============================================================
     WHAT THIS DOES:
       Declares She Said Sail as a structured entity to all search engines and AI systems.
       The dual @type array signals both a local place of business AND a tourism information
       resource, broadening the entity surface area in knowledge graphs.
       The @id URI acts as the canonical entity identifier referenced by all other schemas
       on the site, creating a coherent entity graph.
       knowsAbout signals topical authority to AI assistants (ChatGPT, Perplexity, Gemini)
       so the brand appears in relevant conversational queries.
       hasOfferCatalog exposes all four experiences as named, structured offers.
       serviceArea with GeoCircle covers the full Miami and Fort Lauderdale operating region.

     AI SYSTEMS HELPED:
       Google Search Knowledge Panel, Google AI Overviews, Bing Copilot, ChatGPT Browse,
       Perplexity, Gemini, Apple Maps, structured entity extraction.

     FIELDS TO UPDATE BEFORE GO-LIVE:
       - telephone: replace placeholder
       - sameAs: replace placeholder URLs
       - image array: replace all placeholder image paths
       - logo: replace placeholder path
-->

  "areaServed": [
    {
      "@type": "City",

      "sameAs": "https://www.wikidata.org/wiki/Q8646"
    },
    {
      "@type": "City",
      "name": "Fort Lauderdale",
      "sameAs": "https://www.wikidata.org/wiki/Q208131"
    },
    {
      "@type": "GeoCircle",

<!-- =============================================================
     SCHEMA BLOCK 2: WebSite
     =============================================================
     WHAT THIS DOES:
       Declares the website as a named entity linked to the Organization via @id reference.
       The SearchAction potentialAction enables Google Sitelinks Searchbox in search results,
       allowing users to search the site directly from the SERP.
       The publisher reference ties the site entity back to the Organization entity,
       strengthening the knowledge graph connection.

     AI SYSTEMS HELPED:
       Google Sitelinks Searchbox, Google Search entity linking, Bing entity graph,
       structured entity extraction for AI answer engines.

     FIELDS TO UPDATE BEFORE GO-LIVE:
       None required. The query-input target URL can be updated if a site search
       feature is added (e.g., ?s={search_term_string} for WordPress default search).
-->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "@id": "https://shesaidsail.com/#website",
  "name": "She Said Sail",
  "url": "https://shesaidsail.com",
  "description": "Private luxury yacht charter experiences in Miami and Fort Lauderdale, designed for women-led celebrations.",
  "publisher": {
    "@id": "https://shesaidsail.com/#organization"
  },
  "potentialAction": {
    "@type": "SearchAction",
    "target": {
      "@type": "EntryPoint",
      "urlTemplate": "https://shesaidsail.com/?s={search_term_string}"
    },
    "query-input": "required name=search_term_string"
  }
}
</script>


<!-- =============================================================
     SCHEMA BLOCK 3: BreadcrumbList (Homepage)
     =============================================================
     WHAT THIS DOES:
       Provides Google and AI systems with a canonical breadcrumb path for the homepage.
       Breadcrumb schemas improve SERP display and help AI answer engines understand
       site hierarchy when answering navigational queries.
       Each page-level metadata file adds its own breadcrumb extending this root path.

     AI SYSTEMS HELPED:
       Google breadcrumb rich results, Bing breadcrumb display, AI navigation understanding.

     FIELDS TO UPDATE BEFORE GO-LIVE:
       None required for this block.
-->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    {
      "@type": "ListItem",
      "position": 1,
      "name": "She Said Sail",
      "item": "https://shesaidsail.com"
    }
  ]
}
</script>

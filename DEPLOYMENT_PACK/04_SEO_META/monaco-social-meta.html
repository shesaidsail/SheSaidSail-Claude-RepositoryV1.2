<!-- =============================================================
     JSON-LD BLOCK 1: Service Schema
     =============================================================
     WHAT THIS DOES:
       Describes Monaco Social as a named, structured service with pricing, audience,
       area served, and a direct booking offer. The provider @id reference ties this
       service back to the Organization entity declared in global-schema.html, building
       a coherent entity graph across the site.
       The audience field signals to AI answer engines that this experience targets
       women celebrating birthdays and elevated group occasions.
       hasOfferCatalog with availability and booking URL surfaces this service in
       Google Shopping-adjacent results and AI trip-planning assistants.

     AI SYSTEMS HELPED:
       Google rich results for Services, AI trip-planning assistants (Perplexity, Gemini,
       ChatGPT Browse), Bing entity graph, Google AI Overviews for event planning queries.

     FIELDS TO UPDATE BEFORE GO-LIVE:
       - Confirm booking URL query parameter matches live form.
       - Confirm image URL once asset is uploaded.
-->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Service",
  "name": "Monaco Social",
  "serviceType": "Yacht Charter",
  "description": "Champagne-led yacht experience in Miami for birthdays and elevated groups. Full crew, curated bar, Bluetooth sound system. Up to 15 guests.",
  "url": "https://shesaidsail.com/experience/monaco-social/",
  "image": "https://shesaidsail.com/wp-content/uploads/monaco-social-hero.jpg",
  "brand": {
    "@type": "Brand",
    "name": "She Said Sail"
  },
  "audience": {
    "@type": "Audience",
    "audienceType": "Women celebrating birthdays, elevated bachelorette groups, milestone celebrations"
  },
  "areaServed": [
    {
      "@type": "City",
      "name": "Miami"
    },
    {
      "@type": "City",
      "name": "Fort Lauderdale"
    }
  ],
  "hasOfferCatalog": {
    "@type": "OfferCatalog",
    "name": "Monaco Social Booking",
    "itemListElement": [
      {
        "@type": "Offer",
        "name": "Monaco Social Experience",
        "description": "Private champagne-led yacht charter for up to 15 guests. Starting from $10,000.",
        "price": "10000",
        "priceCurrency": "USD",
        "availability": "https://schema.org/InStock",
        "url": "https://shesaidsail.com/request-to-book/?selected_experience=monaco-social",
        "priceSpecification": {
          "@type": "PriceSpecification",
          "minPrice": "10000",
          "priceCurrency": "USD",
          "description": "Starting from $10,000. Final price based on group size and date."
        }
      }
    ]
  },
  "offers": {
    "@type": "Offer",
    "price": "10000",
    "priceCurrency": "USD",
    "availability": "https://schema.org/InStock",
    "url": "https://shesaidsail.com/request-to-book/?selected_experience=monaco-social",
    "priceSpecification": {
      "@type": "PriceSpecification",
      "minPrice": "10000",
      "priceCurrency": "USD",
      "description": "Starting from $10,000. Final price based on group size and date."
    }
  },
  "provider": {
    "@id": "https://shesaidsail.com/#organization"
  }
}
</script>


<!-- =============================================================
     JSON-LD BLOCK 2: BreadcrumbList
     =============================================================
     WHAT THIS DOES:
       Provides the SERP breadcrumb trail for the Monaco Social page.
       Breadcrumbs help Google display the page's position in site hierarchy
       directly in search results, improving click-through rates.
       The three-level path (Home, Experiences, Monaco Social) matches the
       expected user navigation pattern and signals content hierarchy to AI systems.

     AI SYSTEMS HELPED:
       Google breadcrumb rich results, Bing breadcrumb display, AI navigation understanding.

     FIELDS TO UPDATE BEFORE GO-LIVE:
       None required for this block.
-->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    {
      "@type": "ListItem",
      "position": 1,
      "name": "Home",
      "item": "https://shesaidsail.com"
    },
    {
      "@type": "ListItem",
      "position": 2,
      "name": "Experiences",
      "item": "https://shesaidsail.com/experiences/"
    },
    {
      "@type": "ListItem",
      "position": 3,
      "name": "Monaco Social",
      "item": "https://shesaidsail.com/experience/monaco-social/"
    }
  ]
}
</script>

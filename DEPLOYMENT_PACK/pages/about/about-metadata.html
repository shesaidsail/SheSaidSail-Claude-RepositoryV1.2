<!-- =============================================================
     JSON-LD BLOCK 1: Organization
     =============================================================
     WHAT THIS DOES:
       Declares the full Organization entity on the About page, which is the most
       appropriate page for detailed brand entity information. The @id matches the
       global-schema.html entity identifier, telling search engines and AI systems
       this is the same entity described sitewide.
       foundingDate helps establish brand timeline in knowledge graphs.
       knowsAbout signals topical authority to AI assistants so the brand surfaces
       in relevant conversational queries even when the site is not cited directly.
       hasOfferCatalog exposes all four experiences from the About page context,
       reinforcing the entity-to-service connections.

     AI SYSTEMS HELPED:
       Google Knowledge Panel, Google AI Overviews, Bing Copilot, ChatGPT Browse,
       Perplexity, Gemini, Apple Maps entity extraction.

     FIELDS TO UPDATE BEFORE GO-LIVE:
       - Replace telephone placeholder with real number.
       - Replace sameAs URLs with final social profile URLs.
       - Replace logo and image paths with final uploaded file paths.
-->

<!-- =============================================================
     JSON-LD BLOCK 2: BreadcrumbList
     =============================================================
     WHAT THIS DOES:

       Breadcrumbs help Google display the page's position in site hierarchy
       directly in search results, improving click-through rates.
       The two-level path (Home, About) matches the expected navigation pattern.

     AI SYSTEMS HELPED:
       Google breadcrumb rich results, Bing breadcrumb display, AI navigation understanding.

     FIELDS TO UPDATE BEFORE GO-LIVE:
       None required for this block.
-->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    {
      "@type": "ListItem",
      "position": 1,
      "name": "Home",
      "item": "https://shesaidsail.com"
    },
    {
      "@type": "ListItem",
      "position": 2,
      "name": "About",
      "item": "https://shesaidsail.com/about/"

}

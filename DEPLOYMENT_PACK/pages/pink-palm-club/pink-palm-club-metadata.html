       high-energy bachelorette parties and large group celebrations wanting music,
       champagne, and Miami skyline views. The 22-guest capacity is the largest of
       all four experiences and should surface in large group queries.

       ChatGPT Browse), Bing entity graph, Google AI Overviews for bachelorette party

     H1 (one only): "Your crew. Open water. Everything already handled."

     H2 (major sections):
          > "Not a boat trip. A full afternoon designed around you." (intro)
          > "Everything that makes the day run smoothly." (details)
          > "Optional add-ons for the day." (add-ons)
          > "The kind of day they still talk about." (social proof)

          > "Tell us about your group." (form)

     H3 (cards and sub-elements):
          > Add-on card names (Charcuterie Board, etc.)

     Never use H1 more than once.
     Never skip from H2 to H4.
     Eyebrow labels are span elements, not headings.
     ============================================================ -->
